<!DOCTYPE html>
<html>
<head>
  <title>Gerador de Vídeo IA</title>
</head>
<body style="font-family: Arial; text-align: center; padding: 20px;">

  <h1>🎬 Criador de Vídeo com IA</h1>

  <textarea id="text" placeholder="Digite sua história..." style="width: 300px; height: 100px;"></textarea>
  <br><br>

  <button onclick="gerar()">Gerar Vídeo</button>

  <h2 id="status"></h2>

  <audio id="audio" controls style="display:none;"></audio>
  <br><br>

  <video id="video" controls width="300" style="display:none;">
    <source src="https://www.w3schools.com/html/mov_bbb.mp4">
  </video>

  <script>
    function gerar() {
      document.getElementById("status").innerText = "Gerando...";
      
      setTimeout(() => {
        document.getElementById("status").innerText = "Pronto!";
        
        const audio = document.getElementById("audio");
        audio.src = "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3";
        audio.style.display = "block";

        document.getElementById("video").style.display = "block";
      }, 2000);
    }
  </script>

</body>
</html>
